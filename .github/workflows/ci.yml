name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  openspec-archived:
    name: OpenSpec changes archived
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OpenSpec changes are archived
        run: |
          extra=$(find openspec/changes -mindepth 1 -maxdepth 1 ! -name archive)
          if [ -n "$extra" ]; then
            echo "Unarchived OpenSpec changes found (run 'opsx:archive' before merging):"
            echo "$extra"
            exit 1
          fi

  ci:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check web UI (typecheck, lint, test)
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Build web UI
        working-directory: web
        run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked
